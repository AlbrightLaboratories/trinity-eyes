[project]
name = "trinity-eyes"
version = "0.1.0"
description = "Resilient market data module with automatic fallbacks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Corey", email = "corey@albrightlabs.com"}
]
keywords = ["market-data", "finance", "mcp", "trading"]

dependencies = [
    "yfinance>=0.2.0",
    "aiohttp>=3.8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
mcp = [
    "mcp-server-python>=0.1.0",
]
redis = [
    "redis>=5.0.0",
]
all = [
    "trinity-eyes[api,mcp,redis]",
]

[project.scripts]
trinity-eyes = "trinity_eyes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
